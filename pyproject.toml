[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aetherguard-excalibur"
version = "1.0.0"
description = "AI Red-Teaming & Attack Simulation Platform — adversarial testing for LLMs, agents, and RAG systems"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "AetherGuard AI" }]

dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
whitebox = [
    "torch>=2.2.0",
    "transformers>=4.38.0",
    "onnxruntime>=1.17.0",
]
nlp = [
    "sentence-transformers>=2.7.0",
    "nltk>=3.8.0",
    "deep-translator>=1.11.0",
]
datasets = [
    "datasets>=2.19.0",
]
vectorstore = [
    "pinecone-client>=3.0.0",
    "weaviate-client>=4.4.0",
    "chromadb>=0.4.0",
    "asyncpg>=0.29.0",
]
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
]
reporting = [
    "jinja2>=3.1.0",
    "weasyprint>=61.0",
    "plotly>=5.18.0",
]
full = [
    "aetherguard-excalibur[whitebox,nlp,vectorstore,api,reporting,datasets]",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.100.0",
    "respx>=0.21.0",
    "ruff>=0.3.0",
]

[project.scripts]
excalibur = "aetherguard_excalibur.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aetherguard_excalibur"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
